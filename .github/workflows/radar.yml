name: Radar OB FVG Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Radar
        run: python radar_scanner.py

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: radar-results
          path: radar_results.csv
          if-no-files-found: ignore
